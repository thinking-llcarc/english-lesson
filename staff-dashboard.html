<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>スタッフ用ダッシュボード｜THINKING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Noto+Serif+JP:wght@400;600;700;900&family=Zilla+Slab:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16263f; --navy-ink:#1d3557; --gold:#b8954a; --gold-d:#8e6f2e;
  --verm:#c8431f; --verm-d:#a63515; --teal:#1f6b5c; --teal-d:#17544a;
  --paper:#faf7f0; --surface:#ffffff; --surface2:#f5f1e8;
  --ink:#232830; --muted:#6b7280; --line:#e6dfce; --line2:#efe9db;
  --teal-soft:#e6f2ee; --verm-soft:#fbe9e3; --gold-soft:#f7efdd; --blue-soft:#e8eef7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --navy:#8fb3dd; --navy-ink:#a9c6e8; --gold:#d9b96f; --gold-d:#e0c484;
    --verm:#e8785a; --verm-d:#f08f74; --teal:#5fc0a8; --teal-d:#79d2bb;
    --paper:#14161a; --surface:#1c1f25; --surface2:#23272e;
    --ink:#e8e6e1; --muted:#9aa2ae; --line:#333842; --line2:#2b3038;
    --teal-soft:#1b3a34; --verm-soft:#3a241e; --gold-soft:#332a18; --blue-soft:#1e2733;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans JP",system-ui,sans-serif;font-size:14px;line-height:1.85;}

.top{background:var(--navy);color:#fff;padding:13px 0;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .top{background:#10131a;}}
.top-in{max-width:1240px;margin:0 auto;padding:0 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.mark{width:36px;height:36px;flex:0 0 36px;border-radius:8px;background:var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-family:"Noto Serif JP",serif;font-weight:900;font-size:14px;color:#16263f;letter-spacing:-.04em;}
.ttl b{display:block;font-family:"Noto Serif JP",serif;font-size:15px;color:#fff;line-height:1.4;}
.ttl span{display:block;font-size:11px;color:#c7d3e2;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ttl span{color:#8d9bad;}}
.top .right{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.btn{border:0;border-radius:8px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;
  font-family:"Noto Sans JP",sans-serif;background:rgba(255,255,255,.14);color:#fff;}
.btn:hover{background:rgba(255,255,255,.24);}
select.exam{border:0;border-radius:8px;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;
  font-family:"Noto Sans JP",sans-serif;background:rgba(255,255,255,.14);color:#fff;max-width:260px;}
select.exam option{background:#16263f;color:#fff;}

.wrap{max-width:1240px;margin:0 auto;padding:18px 18px 70px;}

.gate{max-width:440px;margin:60px auto;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:26px 24px;}
.gate h1{font-family:"Noto Serif JP",serif;font-size:18px;margin:0 0 6px;color:var(--navy-ink);}
.gate p{font-size:13px;color:var(--muted);margin:0 0 16px;line-height:1.85;}
.gate input{width:100%;border:1.5px solid var(--line);border-radius:9px;background:var(--surface);
  color:var(--ink);font-size:15px;padding:11px 13px;font-family:"Zilla Slab",serif;letter-spacing:.04em;}
.gate input:focus{outline:none;border-color:var(--gold);}
.gate button{width:100%;margin-top:12px;border:0;border-radius:9px;background:var(--navy);color:#fff;
  font-family:"Noto Serif JP",serif;font-size:15px;font-weight:700;padding:13px;cursor:pointer;letter-spacing:.05em;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gate button{background:#2d4a73;color:#eaf1fa;}}
.gate .msg{color:var(--verm-d);font-size:12.5px;margin:11px 0 0;display:none;}
.gate .msg.show{display:block;}

.bar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:0 0 14px;}
.bar input.search{flex:1 1 200px;max-width:300px;border:1.5px solid var(--line);border-radius:9px;
  background:var(--surface);color:var(--ink);font-size:14px;padding:9px 12px;}
.bar input.search:focus{outline:none;border-color:var(--gold);}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface);}
.seg button{border:0;background:none;padding:9px 15px;font-size:12.5px;font-weight:700;cursor:pointer;
  color:var(--muted);font-family:"Noto Sans JP",sans-serif;}
.seg button.on{background:var(--navy);color:#fff;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .seg button.on{background:#2d3a4e;color:var(--navy-ink);}}

.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px;}
.stat{flex:1 1 118px;background:var(--surface);border:1px solid var(--line);border-radius:11px;
  padding:12px 14px;text-align:center;}
.stat b{display:block;font-family:"Zilla Slab",serif;font-size:23px;color:var(--navy-ink);line-height:1.2;}
.stat span{display:block;font-size:11px;color:var(--muted);margin-top:2px;}

.tbl-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
th{background:var(--navy);color:#f2eee2;font-family:"Noto Serif JP",serif;font-size:11.5px;padding:8px 9px;
  text-align:left;font-weight:700;white-space:nowrap;cursor:pointer;position:sticky;top:0;z-index:2;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) th{background:#2d3a4e;color:#f2eee2;}}
th .ar{opacity:.45;font-size:10px;margin-left:3px;}
th.sorted .ar{opacity:1;}
td{border-top:1px solid var(--line2);padding:8px 9px;background:var(--surface) !important;color:var(--ink) !important;
  vertical-align:middle;white-space:nowrap;}
tr.r:hover td{background:var(--surface2) !important;cursor:pointer;}
td.num{font-family:"Zilla Slab",serif;font-weight:700;text-align:right;}
td.ctr{text-align:center;font-family:"Zilla Slab",serif;font-weight:700;}
td.nm{font-weight:700;color:var(--navy-ink) !important;}
td.o{color:var(--teal-d) !important;} td.x{color:var(--verm-d) !important;opacity:.75;}
.pill{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px;}
.pill.ok{background:var(--teal-soft);color:var(--teal-d);}
.pill.part{background:var(--gold-soft);color:var(--gold-d);}
.pill.no{background:var(--verm-soft);color:var(--verm-d);}
.pill.wait{background:var(--blue-soft);color:var(--navy-ink);}

.meter{margin:8px 0 0;}
.meter-r{display:flex;align-items:center;gap:11px;padding:6px 0;font-size:13px;}
.meter-r .ml{flex:0 0 38%;max-width:420px;line-height:1.55;}
.meter-r .ml em{font-style:normal;font-family:"Zilla Slab",serif;color:var(--gold-d);font-weight:700;margin-right:7px;}
.meter-r .ml .ok{color:var(--teal-d);font-weight:700;}
.meter-r .mb{flex:1;height:10px;border-radius:99px;background:var(--line2);overflow:hidden;min-width:50px;}
.meter-r .mf{height:100%;border-radius:99px;background:var(--teal);}
.meter-r .mf.low{background:var(--verm);} .meter-r .mf.mid{background:var(--gold);}
.meter-r .mv{flex:0 0 62px;text-align:right;font-family:"Zilla Slab",serif;font-weight:700;font-size:12.5px;color:var(--muted);}
.whyline{font-size:12px;color:var(--muted);margin:0 0 6px;padding-left:calc(38% + 11px);line-height:1.7;}
@media (max-width:700px){.meter-r .ml{flex:0 0 46%;}.whyline{padding-left:0;}}

.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:0 0 14px;}
.card h3{font-family:"Noto Serif JP",serif;font-size:15px;margin:0 0 4px;color:var(--navy-ink);
  padding-left:10px;border-left:4px solid var(--gold);line-height:1.5;}
.card .ask{font-family:"Zilla Slab",Georgia,serif;font-size:13px;color:var(--muted);
  margin:0 0 10px;padding-left:14px;line-height:1.7;}

.ov{position:fixed;inset:0;background:rgba(10,14,20,.55);z-index:90;display:none;}
.ov.show{display:block;}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--paper);z-index:91;
  overflow-y:auto;transform:translateX(100%);transition:transform .25s;box-shadow:-10px 0 40px rgba(0,0,0,.18);}
.dw.show{transform:none;}
.dw-h{position:sticky;top:0;background:var(--navy);color:#fff;padding:15px 20px;display:flex;
  align-items:center;gap:12px;z-index:3;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dw-h{background:#10131a;}}
.dw-h b{display:block;font-family:"Noto Serif JP",serif;font-size:16px;line-height:1.4;}
.dw-h span{display:block;font-size:11.5px;color:#c7d3e2;line-height:1.5;margin-top:1px;}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dw-h span{color:#8d9bad;}}
.dw-h .x{margin-left:auto;border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;
  width:32px;height:32px;font-size:16px;cursor:pointer;flex:0 0 32px;}
.dw-b{padding:18px 20px 60px;}
.qb{background:var(--surface);border:1px solid var(--line);border-radius:11px;margin:0 0 11px;overflow:hidden;}
.qb-h{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--surface2);
  border-bottom:1px solid var(--line2);flex-wrap:wrap;}
.qb-h b{font-family:"Zilla Slab",serif;font-size:14px;color:var(--navy-ink);}
.qb-h .bar2{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap;}
.eb{font-family:"Zilla Slab",serif;font-size:10.5px;font-weight:700;border-radius:4px;padding:2px 7px;white-space:nowrap;}
.eb.o{background:var(--teal-soft);color:var(--teal-d);}
.eb.x{background:var(--verm-soft);color:var(--verm-d);}
.qb-b{padding:12px 13px;}
.at{font-size:13.5px;line-height:1.9;white-space:pre-wrap;background:var(--surface2);border-radius:8px;padding:10px 12px;}
.ac{font-size:12.8px;line-height:1.85;margin:10px 0 0;padding-left:11px;border-left:3px solid var(--gold);color:var(--ink);}
.mini{font-family:"Zilla Slab",Georgia,serif;font-size:12.5px;color:var(--muted);margin:0 0 7px;line-height:1.65;}

.nodata{background:var(--surface2);border:1px dashed var(--line);border-radius:11px;padding:22px;
  text-align:center;color:var(--muted);font-size:13px;line-height:1.9;}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);
  border-top-color:var(--gold);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px;margin-right:8px;}
@keyframes sp{to{transform:rotate(360deg);}}
.view{display:none;} .view.on{display:block;}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="mark">THK</div>
    <div class="ttl"><b>スタッフ用ダッシュボード</b><span id="examSub">—</span></div>
    <div class="right">
      <select class="exam" id="examSel"></select>
      <button class="btn" id="csv">CSV</button>
      <button class="btn" id="reload">更新</button>
    </div>
  </div>
</header>

<div class="gate" id="gate" style="display:none;">
  <h1>読み込めませんでした</h1>
  <p>通信に失敗したか、GAS側の設定が未完了の可能性があります。ページを再読み込みしてみてください。</p>
  <p class="msg" id="gmsg"></p>
</div>

<div class="wrap" id="main" style="display:none;">
  <div class="bar">
    <div class="seg">
      <button class="on" data-v="list">提出一覧</button>
      <button data-v="stats">設問別の正答率</button>
    </div>
    <input class="search" id="q" placeholder="氏名・識別番号で絞り込む">
    <span style="font-size:12.5px;color:var(--muted);" id="count"></span>
  </div>

  <div class="view on" id="v-list">
    <div class="stat-row" id="cards"></div>
    <div class="tbl-wrap"><table id="tbl"></table></div>
    <p style="font-size:12.5px;color:var(--muted);margin:11px 0 0;">行をクリックすると、その生徒の解答が開きます。見出しをクリックすると並べ替えできます。</p>
  </div>

  <div class="view" id="v-stats"></div>
</div>

<div class="ov" id="ov"></div>
<aside class="dw" id="dw">
  <div class="dw-h"><div><b id="dwName">—</b><span id="dwSub"></span></div><button class="x" id="dwX">×</button></div>
  <div class="dw-b" id="dwBody"></div>
</aside>

<script>
/* ================= 設定 ================= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbz6LpHxluZ4GTz9WVlEb0ePy_0yYFRRUmkShOGim8dynSBrLQcjDV8u0ehv_UpwNxHX4g/exec";
const EX_KEY = 'thinking-staff-exam';

const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const $ = id => document.getElementById(id);
const pct = v => Math.round((v||0)*100);

let DATA = null, EXAMS = [], EXAM = '', rowsView = [], sortKey = 'total', sortAsc = false;

/* ================= 操作 ================= */
$('reload').addEventListener('click', ()=> load());
$('examSel').addEventListener('change', ()=>{
  EXAM = $('examSel').value;
  try{ localStorage.setItem(EX_KEY, EXAM); }catch(e){}
  load();
});

function gate(msg){
  $('gate').style.display='block'; $('main').style.display='none';
  if(msg){ $('gmsg').textContent = msg; $('gmsg').classList.add('show'); }
}

/* ================= 読み込み ================= */
async function boot(){
  if(!GAS_URL || GAS_URL.indexOf('http') !== 0)
    return gate('送信先（GAS_URL）がこのページに設定されていません。');
  try{
    const r = await fetch(GAS_URL + '?view=exams');
    const d = await r.json();
    if(!d || d.ok !== true) throw new Error(d && d.error ? d.error : 'unknown');
    EXAMS = d.exams || [];
    const saved = (()=>{ try{ return localStorage.getItem(EX_KEY) || ''; }catch(e){ return ''; } })();
    const url = new URLSearchParams(location.search).get('exam');
    EXAM = url || (EXAMS.some(e=>e.id===saved) ? saved : (EXAMS[0] && EXAMS[0].id) || '');
    $('examSel').innerHTML = EXAMS.map(e=>
      `<option value="${esc(e.id)}"${e.id===EXAM?' selected':''}>${esc(e.title)}</option>`).join('');
    load();
  }catch(e){ gate('大問の一覧を取得できませんでした：' + e.message); }
}

async function load(){
  try{
    const url = GAS_URL + '?view=staff&exam=' + encodeURIComponent(EXAM);
    const res = await fetch(url);
    const d = await res.json();
    if(!d || d.ok !== true) throw new Error(d && d.error ? d.error : 'unknown');
    DATA = d;
    $('gate').style.display='none'; $('main').style.display='block';
    $('examSub').textContent = d.exam.source || d.exam.title;
    sortKey = 'total'; sortAsc = false;
    render();
  }catch(e){ gate('開けませんでした：' + e.message); }
}

/* ================= 一覧 ================= */
function unit(){ return DATA.exam.kind === 'choice' ? '問正解' : '点'; }

function render(){
  const s = DATA.stats, m = DATA.exam.max;
  const cards = [
    ['提出', s.n], ['採点済み', s.graded], ['未採点', s.n - s.graded],
    ['平均 / ' + m + (DATA.exam.kind==='choice'?'問':'点'), s.totalAvg.toFixed(1)]
  ];
  const hardest = s.perQ.filter(q=>q.rate!=null).sort((a,b)=>a.rate-b.rate)[0];
  if(hardest) cards.push(['最低正答率（設問' + hardest.id + '）', pct(hardest.rate) + '%']);
  $('cards').innerHTML = cards.map(c=>
    `<div class="stat"><b>${c[1]}</b><span>${esc(c[0])}</span></div>`).join('');
  renderTable(); renderStats();
}

function cols(){
  const c = [
    {k:'ts', t:'提出'}, {k:'sid', t:'識別番号'}, {k:'sname', t:'氏名', cls:'nm'}
  ];
  DATA.questions.forEach(q=>{
    c.push({k:'Q'+q.id, t:q.id, q:q, cls:'ctr'});
  });
  c.push({k:'total', t: DATA.exam.kind==='choice' ? '正答数' : '合計', cls:'num'});
  if(DATA.exam.kind !== 'choice') c.push({k:'status', t:'状態'});
  return c;
}

function cellFor(s, col){
  if(!col.q) return esc(s[col.k]);
  const q = col.q;
  if(q.type === 'desc'){
    const p = s.pts[q.id];
    return `<span class="pill ${p===q.points?'ok':(p>0?'part':'no')}">${p==null?'—':p}</span>`;
  }
  const ok = s.ok[q.id], a = s.ans[q.id];
  return `<span class="${ok?'o':'x'}" style="font-family:'Zilla Slab',serif;font-weight:700;">${esc(a||'—')}</span>`;
}

function renderTable(){
  const q = $('q').value.trim().toLowerCase();
  rowsView = DATA.students.filter(s =>
    !q || String(s.sname).toLowerCase().includes(q) || String(s.sid).toLowerCase().includes(q));
  rowsView.sort((a,b)=>{
    const x = a[sortKey], y = b[sortKey];
    if(typeof x === 'number' && typeof y === 'number') return sortAsc ? x-y : y-x;
    const r = String(x==null?'':x).localeCompare(String(y==null?'':y),'ja');
    return sortAsc ? r : -r;
  });
  $('count').textContent = rowsView.length + ' 件';

  const C = cols();
  const head = '<thead><tr>' + C.map(c=>
    `<th data-k="${c.k}" class="${sortKey===c.k?'sorted':''}">${esc(c.t)}<span class="ar">${sortKey===c.k?(sortAsc?'▲':'▼'):'↕'}</span></th>`
  ).join('') + '</tr></thead>';
  const body = '<tbody>' + rowsView.map((s,i)=>
    '<tr class="r" data-i="'+i+'">' + C.map(c=>
      `<td class="${c.cls||''}">${c.k==='status'
        ? `<span class="pill ${s.status==='採点済'?'ok':(s.status==='エラー'?'no':'wait')}">${esc(s.status)}</span>`
        : cellFor(s, c)}</td>`).join('') + '</tr>').join('') + '</tbody>';

  $('tbl').innerHTML = head + (rowsView.length ? body :
    '<tbody><tr><td colspan="'+C.length+'" style="text-align:center;color:var(--muted);padding:26px;">該当する提出がありません</td></tr></tbody>');

  $('tbl').querySelectorAll('th').forEach(th=>{
    th.addEventListener('click', ()=>{
      const k = th.dataset.k;
      if(k.indexOf('Q') === 0){
        const qid = k.slice(1);
        DATA.students.forEach(s=>{
          const q2 = DATA.questions.filter(x=>x.id===qid)[0];
          s[k] = q2 && q2.type === 'desc' ? (s.pts[qid]||0) : (s.ok[qid] ? 1 : 0);
        });
      }
      if(sortKey === k) sortAsc = !sortAsc; else { sortKey = k; sortAsc = false; }
      renderTable();
    });
  });
  $('tbl').querySelectorAll('tr.r').forEach(tr=>
    tr.addEventListener('click', ()=> openCard(rowsView[Number(tr.dataset.i)])));
}
$('q').addEventListener('input', renderTable);

document.querySelectorAll('.seg button').forEach(b=>{
  b.addEventListener('click', ()=>{
    document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.view').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); $('v-' + b.dataset.v).classList.add('on');
  });
});

/* ================= 設問別の正答率 ================= */
function renderStats(){
  const s = DATA.stats;
  const byId = {}; DATA.questions.forEach(q=> byId[q.id] = q);
  const h = [];

  const ranked = s.perQ.filter(q=>q.rate!=null).slice().sort((a,b)=>a.rate-b.rate);
  if(ranked.length){
    h.push(`<div class="card"><h3>正答率の低い順</h3>
      <p class="ask">ここが授業で扱うべき設問です。</p><div class="meter">` +
      ranked.map(q=>{
        const v = q.rate, cls = v<0.4?'low':(v<0.7?'mid':'');
        return `<div class="meter-r"><div class="ml"><em>設問${esc(q.id)}</em>正解 ${esc([].concat(q.answer).join('・'))}</div>
          <div class="mb"><div class="mf ${cls}" style="width:${pct(v)}%"></div></div>
          <div class="mv">${pct(v)}%</div></div>`;
      }).join('') + `</div></div>`);
  }

  s.perQ.forEach(p=>{
    const q = byId[p.id] || {};
    if(p.type === 'desc'){
      h.push(`<div class="card"><h3>設問${esc(p.id)}　平均 ${(p.avg||0).toFixed(1)} / ${p.points}点　（満点 ${p.full||0}人 ／ 0点 ${p.zero||0}人）</h3>
        <div class="meter">` + (q.elements||[]).map(e=>{
          const v = (p.elemRate||{})[e.key] || 0, cls = v<0.35?'low':(v<0.7?'mid':'');
          return `<div class="meter-r"><div class="ml"><em>${e.key}</em>${esc(e.label)}（${e.pt}点）</div>
            <div class="mb"><div class="mf ${cls}" style="width:${pct(v)}%"></div></div>
            <div class="mv">${pct(v)}%</div></div>`;
        }).join('') + `</div></div>`);
      return;
    }
    const ans = [].concat(p.answer || []);
    const isAns = L => ans.indexOf(L) >= 0;
    const labels = DATA.exam.kind === 'choice'
      ? ['A','B','C','D','E','F','G','H'] : ['1','2','3','4','5','6','7','8'];
    const tot = s.n || 1;
    h.push(`<div class="card">
      <h3>設問${esc(p.id)}　正答率 ${pct(p.rate)}%　（正解 ${esc(ans.join('・'))}）</h3>
      ${q.ask ? `<p class="ask">${esc(q.ask)}</p>` : ''}
      <div class="meter">` +
      (q.choices||[]).map((t,i)=>{
        const L = labels[i], c = (p.dist||{})[L] || 0, v = c/tot;
        const why = (q.why||{})[L];
        return `<div class="meter-r">
            <div class="ml"><em>${L}</em>${isAns(L)?'<span class="ok">正解</span> ':''}${esc(String(t).slice(0,46))}</div>
            <div class="mb"><div class="mf ${isAns(L)?'':'low'}" style="width:${pct(v)}%"></div></div>
            <div class="mv">${c}人 ${pct(v)}%</div></div>` +
          (!isAns(L) && c > 0 && why ? `<p class="whyline">${esc(why)}</p>` : '');
      }).join('') + `</div></div>`);
  });

  $('v-stats').innerHTML = h.join('');
}

/* ================= 生徒カルテ ================= */
function openCard(s){
  if(!s) return;
  $('dwName').textContent = s.sname || '（氏名なし）';
  $('dwSub').textContent = [s.sid, s.ts,
    (DATA.exam.kind==='choice' ? s.total + ' / ' + DATA.exam.max + '問正解'
                               : '合計 ' + s.total + ' / ' + DATA.exam.max + '点')]
    .filter(Boolean).join('　／　');

  const byId = {}; DATA.questions.forEach(q=> byId[q.id] = q);
  const h = [];
  DATA.questions.forEach(q=>{
    if(q.type === 'desc'){
      const p = s.pts[q.id], el = s.el[q.id] || {}, cm = s.cm[q.id] || '';
      const badges = (q.elements||[]).map(e=>
        `<span class="eb ${el[e.key]?'o':'x'}">${e.key} ${el[e.key]?'○':'×'}</span>`).join('');
      h.push(`<div class="qb"><div class="qb-h"><b>設問${esc(q.id)}</b>
        <span class="pill ${p===q.points?'ok':(p>0?'part':'no')}">${p==null?'—':p} / ${q.points}点</span>
        <span class="bar2">${badges}</span></div>
        <div class="qb-b"><div class="at">${esc(s.ans[q.id] || '（無回答）')}</div>
        ${cm ? `<div class="ac">${esc(cm)}</div>` : ''}</div></div>`);
      return;
    }
    const a = s.ans[q.id], ok = s.ok[q.id], ans = [].concat(q.answer||[]);
    const labels = DATA.exam.kind === 'choice' ? ['A','B','C','D'] : ['1','2','3','4','5','6','7','8'];
    const picked = (q.choices||[])[labels.indexOf(String(a))] || '';
    h.push(`<div class="qb"><div class="qb-h"><b>設問${esc(q.id)}</b>
      <span class="pill ${ok?'ok':'no'}">${esc(a||'—')}　${ok?'正解':'誤答'}</span>
      <span class="bar2"><span class="eb o">正解 ${esc(ans.join('・'))}</span></span></div>
      <div class="qb-b">
        ${q.ask ? `<p class="mini">${esc(q.ask)}</p>` : ''}
        ${picked ? `<div class="at">選んだ選択肢：${esc(picked)}</div>` : ''}
        ${!ok && (q.why||{})[String(a)] ? `<div class="ac">${esc(q.why[String(a)])}</div>` : ''}
      </div></div>`);
  });

  if(s.summary) h.push(`<div class="card"><h3>この文章は、つまりどういう話か</h3><div class="at">${esc(s.summary)}</div></div>`);
  if(s.overall) h.push(`<div class="card"><h3>総評</h3><p style="margin:0;">${esc(s.overall)}</p></div>`);

  $('dwBody').innerHTML = h.join('');
  $('ov').classList.add('show'); $('dw').classList.add('show');
}
function closeCard(){ $('ov').classList.remove('show'); $('dw').classList.remove('show'); }
$('ov').addEventListener('click', closeCard);
$('dwX').addEventListener('click', closeCard);
document.addEventListener('keydown', e=>{ if(e.key === 'Escape') closeCard(); });

/* ================= CSV ================= */
$('csv').addEventListener('click', ()=>{
  if(!DATA) return;
  const head = ['提出','識別番号','氏名'];
  DATA.questions.forEach(q=> head.push('設問' + q.id, '設問' + q.id + (q.type==='desc'?'得点':'正誤')));
  head.push(DATA.exam.kind==='choice' ? '正答数' : '合計', '言語化', '状態');
  const esq = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const lines = [head.map(esq).join(',')];
  rowsView.forEach(s=>{
    const r = [s.ts, s.sid, s.sname];
    DATA.questions.forEach(q=>{
      r.push(s.ans[q.id] || '');
      r.push(q.type==='desc' ? (s.pts[q.id]==null?'':s.pts[q.id]) : (s.ok[q.id]?'○':'×'));
    });
    r.push(s.total, s.summary || '', s.status || '');
    lines.push(r.map(esq).join(','));
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = EXAM + '-results.csv';
  a.click(); URL.revokeObjectURL(a.href);
});

boot();
</script>
